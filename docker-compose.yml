services:
  # PostgreSQL với PostGIS
  postgres:
    image: postgis/postgis:16-3.4
    container_name: xsmart_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ngb
      POSTGRES_PASSWORD: ngb
      POSTGRES_DB: ngb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      xsmart: {}
    restart: always

  # Kafka (KRaft mode)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: xsmart_kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      CLUSTER_ID: "MkQkRmVUOTFkZGVhODEwOA=="
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      xsmart: {}
    restart: always

  # Scorpio Broker
  scorpio:
    image: scorpiobroker/all-in-one-runner:java-kafka-latest
    container_name: xsmart_scorpio
    ports:
      - "9090:9090"
    environment:
      QUARKUS_HTTP_PORT: 9090
      DBHOST: postgres
      DBPORT: 5432
      DBUSER: ngb
      DBPASS: ngb
      DBNAME: ngb
      BUSHOST: kafka
      BUSPORT: 29092
      GATEWAY_HOST: localhost
      GATEWAY_PORT: 9090
    depends_on:
      - postgres
      - kafka
    networks:
      xsmart: {}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/ngsi-ld/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 5

  # HISTORY STORAGE - TimescaleDB
  timescale:
    image: timescale/timescaledb:latest-pg14
    container_name: xsmart_timescale
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ngb
      POSTGRES_PASSWORD: ngb
      POSTGRES_DB: ngb
    networks:
      xsmart: {}
    restart: always
    volumes:
      - timescale_data:/var/lib/postgresql/data

  # HISTORY ADAPTER - QuantumLeap
  quantumleap:
    image: orchestracities/quantumleap:1.0.0
    container_name: xsmart_quantumleap
    ports:
      - "8668:8668"
    depends_on:
      - timescale
      - scorpio
    environment:
      # Force sử dụng Timescale backend
      QL_DEFAULT_DB: timescale
      USE_GEOCODING: "false"
      CACHE_QUERIES: "true"
      
      # Timescale connection
      POSTGRES_HOST: timescale
      POSTGRES_PORT: 5432
      POSTGRES_DB_NAME: ngb
      POSTGRES_DB_USER: ngb
      POSTGRES_DB_PASS: ngb
      POSTGRES_USE_SSL: "False"
      
      # Disable CrateDB
      CRATE_WAIT_ACTIVE_SHARDS: 0
      
      # NGSI-LD Support
      KEEP_RAW_ENTITY: "true"
      
      # Logging
      LOG_LEVEL: DEBUG
      LOGLEVEL: DEBUG
    networks:
      xsmart: {}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8668/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Dịch vụ Backend (Nest.js)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xsmart_backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - scorpio
      - kafka
    environment:
      PORT: 8080
      
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ngb
      DB_PASSWORD: ngb
      DB_DATABASE: ngb
      
      KAFKA_BROKER: kafka:29092
      
      SCORPIO_URL: http://scorpio:9090
      SCORPIO_API_VERSION: v1

      OPENWEATHER_API_KEY: eb3a4947904547285aa7bdecca8cc396

      JWT_SECRET: DAY_LA_BI_MAT_KHONG_DUOC_LO_RA_NGOAI

      GOOGLE_CLIENT_ID: your_google_client_id_here.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: your_google_client_secret_here
      GOOGLE_CALLBACK_URL: http://localhost:8080/auth/google/callback

    networks:
      xsmart: {}
    restart: unless-stopped

  # Dịch vụ Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xsmart_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
      NEXT_PUBLIC_SCORPIO_URL: http://localhost:9090
    networks:
      xsmart: {}
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data:
  timescale_data:

networks:
  xsmart:
    driver: bridge