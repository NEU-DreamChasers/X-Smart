services:
  # PostgreSQL với PostGIS
  postgres:
    image: postgis/postgis:16-3.4
    container_name: xsmart_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      xsmart: {}
    restart: always

  # Kafka (KRaft mode)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: xsmart_kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      CLUSTER_ID: "MkQkRmVUOTFkZGVhODEwOA=="
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      xsmart: {}
    restart: always

  # Scorpio Broker
  scorpio:
    image: scorpiobroker/all-in-one-runner:java-kafka-latest
    container_name: xsmart_scorpio
    ports:
      - "9090:9090"
    environment:
      QUARKUS_HTTP_PORT: 9090
      DBHOST: postgres
      DBPORT: 5432
      DBUSER: ${DB_USERNAME}
      DBPASS: ${DB_PASSWORD}
      DBNAME: ${DB_DATABASE}
      BUSHOST: kafka
      BUSPORT: 29092
      GATEWAY_HOST: localhost
      GATEWAY_PORT: 9090
    depends_on:
      - postgres
      - kafka
    networks:
      xsmart: {}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/ngsi-ld/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  # miniio
  minio:
    image: minio/minio:latest
    container_name: xsmart_minio
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Console UI Port
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      xsmart: {}
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

  # (Tùy chọn) Service để tự động tạo Bucket khi khởi động
  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb --ignore-existing myminio/x-smart-reports;
      /usr/bin/mc policy set download myminio/x-smart-reports;
      exit 0;
      "

  # Dịch vụ Backend (Nest.js)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xsmart_backend
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env  
    depends_on:
      - postgres
      - scorpio
      - kafka
    environment:
      PORT: ${PORT}
      
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      
      KAFKA_BROKER: kafka:29092
      
      SCORPIO_URL: http://scorpio:9090
      SCORPIO_API_VERSION: v1

    networks:
      xsmart: {}
    restart: unless-stopped

  # Dịch vụ Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xsmart_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SCORPIO_URL: ${NEXT_PUBLIC_SCORPIO_URL}
    networks:
      xsmart: {}
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data:

networks:
  xsmart:
    driver: bridge